[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "helios-debug"
version = "0.1.0"
description = "AMD Helios scale-up debug tools: link check with a root cause per down / degraded GPU link"
requires-python = ">=3.10"
dependencies = ["paramiko>=3.4", "PyYAML>=6.0"]

[project.optional-dependencies]
test = ["pytest>=7.4"]

[tool.setuptools]
packages = ["heliosdbg"]
